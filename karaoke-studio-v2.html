<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karaoke Studio V2 - Babloe</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Montserrat:wght@700&family=Bebas+Neue&family=Anton&family=Oswald:wght@700&family=Righteous&family=Fredoka:wght@700&family=Outfit:wght@700;800&family=Space+Grotesk:wght@700&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>:root{--bg:#0a0a0e;--panel:#15151c;--border:#232330;--accent:#a855f7;--yellow:#facc15;--blue:#60a5fa}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:'Outfit',system-ui;min-height:100vh;display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#0f0f15} .logo{font-weight:900} .logo span{color:var(--accent)} .btn{border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer} .btn-primary{background:#fff;color:#000} .btn-ghost{background:var(--panel);color:#fff;border:1px solid var(--border)} .btn-accent{background:var(--accent);color:#fff} .layout{display:grid;grid-template-columns:320px 1fr 340px;flex:1} .panel{background:var(--panel);border-right:1px solid var(--border);padding:16px;overflow:auto} .panel h3{font-size:.82rem;opacity:.6;margin:18px 0 10px;text-transform:uppercase} .layer{background:#1c1c27;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px} .layer-title{font-weight:800;font-size:.9rem} .preview-wrap{flex:1;display:flex;flex-direction:column;background:#000;position:relative;min-height:500px} #previewCanvas{width:100%;height:100%;max-height:70vh;object-fit:contain;background:#000} .preview-overlay{position:absolute;bottom:24px;left:0;right:0;text-align:center;padding:0 8%;pointer-events:none} #lyricDisplay{font-size:3.2rem;line-height:1.2;font-weight:900;min-height:1.4em} .word{display:inline-block;margin:0 6px;transition:.15s;opacity:.32;transform:scale(.92)} .word.pre{color:var(--yellow);opacity:1;transform:scale(1.08)} .word.active{color:var(--blue);opacity:1;transform:scale(1.25)} .controls{padding:14px;background:#111116;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center} .progress{flex:1;height:8px;background:#222;border-radius:999px;overflow:hidden;cursor:pointer;min-width:200px} .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0%} textarea{width:100%;min-height:120px;background:#0f0f14;border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px;font-family:monospace;font-size:.85rem} select,input[type=text]{width:100%;background:#0f0f14;border:1px solid var(--border);color:#fff;border-radius:10px;padding:10px;margin-top:6px} .font-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} .font-opt{background:#1c1c27;border:2px solid transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:center;font-size:1.1rem} .font-opt.active{border-color:var(--accent)} .small{font-size:.78rem;opacity:.6}</style></head>
<body><header><div class="logo">karaoke.<span>babloe</span>.com — STUDIO V2</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="exportJSON()">Save</button><button class="btn btn-accent" onclick="startRender()">RENDER MP4</button><button class="btn btn-primary" id="playBtn" onclick="togglePlay()">Play</button></div></header>

<div class="layout"><div class="panel"><h3>Layer Musik</h3><div class="layer"><div class="layer-title">Musik</div><input type="file" id="musicFile" accept="audio/*"><input type="range" id="musicVol" min="0" max="100" value="90"></div><h3>Layer Vokal</h3><div class="layer"><div class="layer-title">Vokal Guide</div><input type="file" id="vocalFile" accept="audio/*"><input type="range" id="vocalVol" min="0" max="100" value="70"><label><input type="checkbox" id="vocalMute"> Mute untuk karaoke</label></div><h3>Layer Video</h3><div class="layer"><div class="layer-title">Video BG</div><input type="file" id="videoFile" accept="video/*"><label><input type="checkbox" id="useVideo" checked> Pakai Video BG</label></div></div>
<div class="preview-wrap"><canvas id="previewCanvas" width="1280" height="720"></canvas><video id="bgVideo" style="display:none" muted loop playsinline></video><div class="preview-overlay"><div id="lyricDisplay"></div></div><div class="controls"><div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div><div><span id="curTime">0.0</span>s / <span id="durTime">0.0</span>s</div></div></div>
<div class="panel"><h3>Lirik & Timing</h3><textarea id="lyricInput">Halo ini Karaoke Babloe
Siap nyanyi bareng?
Lagu ini akan muncul kuning
2 detik sebelum lalu biru pas vokal!</textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-ghost" style="flex:1" onclick="parseLyrics()">Parse Lirik</button><button class="btn btn-accent" style="flex:1" onclick="tapTiming()">TAP TIMING</button></div><div class="small">Kata: <b id="tapWord">-</b></div><h3>Font Type</h3><select id="fontSelect" onchange="changeFont(this.value)"><option value="'Poppins', sans-serif">Poppins</option><option value="'Montserrat', sans-serif">Montserrat</option><option value="'Bebas Neue', sans-serif">Bebas Neue</option><option value="'Anton', sans-serif">Anton</option><option value="'Oswald', sans-serif">Oswald</option><option value="'Righteous', sans-serif">Righteous</option><option value="'Fredoka', sans-serif">Fredoka</option><option value="'Outfit', sans-serif" selected>Outfit</option><option value="'Space Grotesk', sans-serif">Space Grotesk</option><option value="'Syne', sans-serif">Syne</option></select><div style="margin-top:10px"><label class="small">Ukuran Font</label><input type="range" id="fontSize" min="20" max="80" value="52" oninput="updateStyle()"><span class="small" id="fontSizeTxt">52px</span><br><label class="small">Kuning</label><input type="color" id="colorPre" value="#facc15" oninput="updateStyle()"><label class="small">Biru</label><input type="color" id="colorActive" value="#60a5fa" oninput="updateStyle()"></div></div></div>

<script>
let audioCtx,musicBuf,vocalBuf,musicNode,vocalNode;let curLyrics=[];let currentTime=0,duration=0,playing=false,animId,startAt,pauseAt=0;let fontFamily="'Outfit', sans-serif";
function changeFont(v){fontFamily=v;document.getElementById('lyricDisplay').style.fontFamily=v;drawCanvas();}
function parseLyrics(){const txt=document.getElementById('lyricInput').value.trim();const lines=txt.split('\n').filter(Boolean);curLyrics=[];let t=0;lines.forEach(line=>{line.split(' ').filter(Boolean).forEach(w=>{curLyrics.push({t:t,w:w});t+=0.6;});t+=0.8;});duration=Math.max(...curLyrics.map(l=>l.t))+2;document.getElementById('durTime').textContent=duration.toFixed(1);tapIndex=0;renderLyrics();drawCanvas();}
let tapIndex=0;function tapTiming(){if(!curLyrics.length)parseLyrics();if(tapIndex>=curLyrics.length){tapIndex=0;alert('Selesai!');return;}curLyrics[tapIndex].t=currentTime;document.getElementById('tapWord').textContent=curLyrics[tapIndex].w+' @ '+currentTime.toFixed(2)+'s';tapIndex++;renderLyrics();drawCanvas();}

function renderLyrics(){const el=document.getElementById('lyricDisplay');el.innerHTML='';curLyrics.forEach((l,i)=>{const s=document.createElement('span');s.className='word';s.id='w'+i;s.textContent=l.w;el.appendChild(s);});}
function updateLyricHighlight(t){curLyrics.forEach((l,i)=>{const e=document.getElementById('w'+i);if(!e)return;const diff=t-l.t;e.className='word';if(diff>=0&&diff<0.6)e.classList.add('active');else if(diff>=-2&&diff<0)e.classList.add('pre');});}
const canvas=document.getElementById('previewCanvas');const ctx=canvas.getContext('2d');
function drawCanvas(){const video=document.getElementById('bgVideo');if(document.getElementById('useVideo').checked&&video.src&&!video.paused){ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,canvas.width,canvas.height);}else{const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#15151e');g.addColorStop(1,'#08080c');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}ctx.font=`900 ${document.getElementById('fontSize').value}px ${fontFamily}`;ctx.textAlign='center';}

function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
async function loadAudioFile(file,type){initAudio();const buf=await file.arrayBuffer();const audioBuf=await audioCtx.decodeAudioData(buf);if(type==='music')musicBuf=audioBuf;else vocalBuf=audioBuf;duration=Math.max(duration,audioBuf.duration);document.getElementById('durTime').textContent=duration.toFixed(1);}
document.getElementById('musicFile').addEventListener('change',e=>{if(e.target.files[0])loadAudioFile(e.target.files[0],'music');});document.getElementById('vocalFile').addEventListener('change',e=>{if(e.target.files[0])loadAudioFile(e.target.files[0],'vocal');});document.getElementById('videoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const v=document.getElementById('bgVideo');v.src=url;v.load();});
function togglePlay(){if(!curLyrics.length)parseLyrics();if(playing)pause();else play();}

function play(){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();if(musicBuf){musicNode=audioCtx.createBufferSource();musicNode.buffer=musicBuf;const g=audioCtx.createGain();g.gain.value=document.getElementById('musicVol').value/100;musicNode.connect(g);g.connect(audioCtx.destination);musicNode.start(0,pauseAt);}if(vocalBuf&&!document.getElementById('vocalMute').checked){vocalNode=audioCtx.createBufferSource();vocalNode.buffer=vocalBuf;const g=audioCtx.createGain();g.gain.value=document.getElementById('vocalVol').value/100;vocalNode.connect(g);g.connect(audioCtx.destination);vocalNode.start(0,pauseAt);}const v=document.getElementById('bgVideo');if(v.src){v.currentTime=pauseAt;v.play();}startAt=audioCtx.currentTime-pauseAt;playing=true;document.getElementById('playBtn').textContent='Pause';loop();}
function pause(){playing=false;if(musicNode)try{musicNode.stop();}catch{}if(vocalNode)try{vocalNode.stop();}catch{}document.getElementById('bgVideo').pause();pauseAt=currentTime;document.getElementById('playBtn').textContent='Play';cancelAnimationFrame(animId);}

function loop(){if(!playing)return;currentTime=audioCtx?audioCtx.currentTime-startAt:pauseAt+0.05;if(currentTime>duration){pause();pauseAt=0;currentTime=0;return;}document.getElementById('curTime').textContent=currentTime.toFixed(1);document.getElementById('progressFill').style.width=currentTime/duration*100+'%';updateLyricHighlight(currentTime);drawCanvas();animId=requestAnimationFrame(loop);}
function updateStyle(){document.getElementById('fontSizeTxt').textContent=document.getElementById('fontSize').value+'px';document.getElementById('lyricDisplay').style.fontSize=document.getElementById('fontSize').value+'px';const pre=document.getElementById('colorPre').value;const act=document.getElementById('colorActive').value;document.documentElement.style.setProperty('--yellow',pre);document.documentElement.style.setProperty('--blue',act);}

function startRender(){alert('Render: browser akan record preview. Play otomatis dan download webm.');initAudio();const stream=canvas.captureStream(30);const dest=audioCtx.createMediaStreamDestination();if(musicBuf){const src=audioCtx.createBufferSource();src.buffer=musicBuf;const g=audioCtx.createGain();g.gain.value=document.getElementById('musicVol').value/100;src.connect(g);g.connect(dest);g.connect(audioCtx.destination);src.start();}if(vocalBuf&&!document.getElementById('vocalMute').checked){const src=audioCtx.createBufferSource();src.buffer=vocalBuf;const g=audioCtx.createGain();g.gain.value=document.getElementById('vocalVol').value/100;src.connect(g);g.connect(dest);g.connect(audioCtx.destination);src.start();}dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const rec=new MediaRecorder(stream,{mimeType:'video/webm'});const chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='karaoke-babloe.webm';a.click();};pauseAt=0;currentTime=0;play();rec.start();setTimeout(()=>{rec.stop();pause();alert('Selesai render!');},(duration+0.5)*1000);}

function exportJSON(){const data={lyrics:curLyrics,font:fontFamily};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='project.json';a.click();}
parseLyrics();updateStyle();drawCanvas();
</script></body></html>
