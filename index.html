<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Babloe</title>
<style>
body{margin:0;background:#0f0f12;color:white;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{max-width:700px;width:90%;text-align:center}
h1{font-size:2.5rem}
.lyric{font-size:2.2rem;line-height:1.6;margin:40px 0;min-height:140px}
.word{display:inline-block;margin:0 7px;transition:all .2s;opacity:.35}
.word.pre{color:#facc15;opacity:1;transform:scale(1.15);text-shadow:0 0 12px #facc15}
.word.active{color:#60a5fa;opacity:1;transform:scale(1.3);text-shadow:0 0 18px #60a5fa}
button{background:white;color:black;border:0;padding:16px 32px;border-radius:999px;font-weight:800;font-size:1.2rem;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>karaoke.babloe.com</h1>
<p style="opacity:.6">Highlight kuning 2 detik sebelum, biru pas vokal</p>
<div class="lyric" id="lyric"></div>
<button id="btn">▶️ Mulai Karaoke</button>
<p id="timer" style="opacity:.5;margin-top:20px">0.0s</p>
</div>
<script>
const LYRICS=[
{t:0,w:'Halo'},{t:0.5,w:'ini'},{t:1,w:'Karaoke'},{t:1.6,w:'Babloe'},
{t:3,w:'Siap'},{t:3.5,w:'nyanyi'},{t:4,w:'bareng?'},
{t:6,w:'Lagu'},{t:6.5,w:'ini'},{t:7,w:'akan'},{t:7.5,w:'muncul'},{t:8,w:'kuning'},
{t:9,w:'2'},{t:9.3,w:'detik'},{t:9.8,w:'sebelum'},{t:11,w:'lalu'},{t:11.5,w:'biru'},{t:12,w:'pas'},{t:12.5,w:'vokal!'}
];
const lyricEl=document.getElementById('lyric');
const btn=document.getElementById('btn');
const timer=document.getElementById('timer');
LYRICS.forEach((l,i)=>{
  const s=document.createElement('span');
  s.className='word'; s.id='w'+i; s.textContent=l.w;
  lyricEl.appendChild(s);
});
let time=-1, playing=false, interval;
function render(t){
  timer.textContent=t.toFixed(1)+'s';
  LYRICS.forEach((l,i)=>{
    const el=document.getElementById('w'+i);
    const diff=t-l.t;
    el.className='word';
    if(diff>=0&&diff<0.6) el.className+=' active';
    else if(diff>=-2&&diff<0) el.className+=' pre';
  });
}
btn.onclick=()=>{
  if(playing){ clearInterval(interval); playing=false; time=-1; render(-1); btn.textContent='▶️ Mulai Karaoke'; return; }
  time=0; playing=true; btn.textContent='⏹️ Stop';
  const start=Date.now();
  interval=setInterval(()=>{ time=(Date.now()-start)/1000; render(time); if(time>14){clearInterval(interval); playing=false; btn.textContent='🔁 Ulangi';} },50);
};
render(-1);
</script>
</body>
</html>
