<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke Babloe v3 - Ibnu Gozali</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet"><script src="https://accounts.google.com/gsi/client" async defer></script><style>:root{--y:#FFD600;--b:#00BFFF;--bg:#0f0f13;--p:#1e1e26}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font-family:Poppins,sans-serif;display:flex;flex-direction:column;min-height:100vh}header{background:linear-gradient(90deg,#1a1a2e,#16213e);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--y)}#loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}.main{display:grid;grid-template-columns:320px 1fr 300px;gap:12px;padding:12px;flex:1}.panel{background:var(--p);border-radius:12px;padding:12px;border:1px solid #333}.canvas-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}#bgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}#mainCanvas{position:relative;z-index:2;width:100%;aspect-ratio:16/9;max-height:60vh}#lyricOverlay{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:3;width:90%;text-align:center}.lyric-word{display:inline-block;margin:4px 6px;padding:10px 18px;border-radius:10px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.6)}.yellow-box{background:var(--y);color:#000}.blue-box{background:var(--b);color:#fff}footer{background:#0a0a0f;padding:14px;text-align:center;border-top:1px solid #333;font-size:12px}footer b{color:var(--y)}</style></head><body>
<div id="loginOverlay"><h2>Karaoke Babloe Studio</h2><p>Login Gratis</p><div id="g_id_onload" data-client_id="794101225266-pjd3pqov3ac21g24kaidsibrdd2oosru.apps.googleusercontent.com" data-callback="handleCredential"></div><div class="g_id_signin" data-type="standard"></div><button onclick="bypassLogin()" style="width:200px;margin-top:20px">Demo (dev)</button></div>

<header><h1>KARAOKE <span>BABLOE</span> v3</h1><span id="userEmail"></span></header>
<div class="main"><div class="panel"><textarea id="lyricInput" style="width:100%;height:120px;background:#12121a;color:#fff">[00:02] Selamat datang
[00:05] di Karaoke Babloe
[00:09] Karya Ibnu Gozali
[00:13] Bersama babloe.com</textarea><button onclick="parseLyrics()" style="width:100%;background:#FFD600;padding:8px;margin-top:6px">Parse</button><button onclick="undoAction()" style="width:100%;margin-top:6px">Undo 99x</button><input type="range" id="yellowLead" min="0.2" max="5" value="2"><div style="display:flex;gap:6px"><input id="fadeIn" value="0.5" placeholder="FadeIn"><input id="fadeOut" value="0.5" placeholder="FadeOut"></div><div style="display:flex;gap:6px;margin-top:6px"><button onclick="setYellowEntry()" style="background:#FFD600;flex:1">Kuning Masuk</button><button onclick="setBlueEntry()" style="background:#00BFFF;flex:1">Biru Masuk</button></div><div id="timeline" style="height:80px;background:#0a0a0f;margin-top:8px;position:relative"></div></div><div class="panel canvas-wrap"><video id="bgVideo" muted playsinline></video><canvas id="mainCanvas" width="1280" height="720"></canvas><div id="lyricOverlay"></div><div id="imageLayer" style="position:absolute;inset:0;z-index:4"></div><div style="width:100%;padding:10px;background:#1e1e26;z-index:5"><div id="progressBar" style="height:6px;background:#333"><div id="progressFill" style="height:100%;background:#FFD600;width:0%"></div></div><div style="display:flex;gap:6px;margin-top:8px"><button id="playBtn" onclick="togglePlay()" style="background:#FFD600;flex:1">Play</button><button onclick="startRender()" style="background:#00BFFF;flex:1">Render</button></div></div></div><div class="panel"><select id="fontSel"><option>Poppins</option><option>Bebas Neue</option></select><input type="range" id="fontSize" min="20" max="120" value="48"><input type="range" id="textYPos" min="5" max="45" value="12"><input type="file" id="musicFile" accept="audio/*"><input type="file" id="vocalFile" accept="audio/*"><input type="file" id="videoFile" accept="video/*"><input type="file" id="imgInsert" accept="image/*" onchange="addImage(event)"></div></div>
<footer>Dibuat oleh : <b>Ibnu Gozali</b> | Diberdayakan oleh : <b>babloe.com 2026</b></footer>

<script>
let audioCtx,musicBuf,vocalBuf,musicNode,compNode,duration=0,currentTime=0,pauseAt=0,startAt=0,playing=false,curLyrics=[],historyStack=[],userLogged=false;
function handleCredential(r){userLogged=true;document.getElementById('loginOverlay').style.display='none';}
function bypassLogin(){userLogged=true;document.getElementById('loginOverlay').style.display='none';}
function parseLyrics(){historyStack.push(JSON.stringify(curLyrics));if(historyStack.length>99)historyStack.shift();let txt=document.getElementById('lyricInput').value.split('\n');curLyrics=[];let re=/\[(\d+):(\d+)(?:\.(\d+))?\]\s*(.*)/;txt.forEach(l=>{let m=l.match(re);if(m){let t=parseInt(m[1])*60+parseInt(m[2]);curLyrics.push({time:t,text:m[4],yellow:t-parseFloat(document.getElementById('yellowLead').value)});}});duration=curLyrics.length?curLyrics[curLyrics.length-1].time+5:0;}
function undoAction(){if(!historyStack.length)return;curLyrics=JSON.parse(historyStack.pop());}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(!compNode){compNode=audioCtx.createDynamicsCompressor();compNode.threshold.value=-12;compNode.ratio.value=12;compNode.connect(audioCtx.destination);}}
async function loadAudioFile(f,t){initAudio();let buf=await f.arrayBuffer();let ab=await audioCtx.decodeAudioData(buf);if(t=='music')musicBuf=ab;else vocalBuf=ab;duration=Math.max(duration,ab.duration);}
document.getElementById('musicFile').addEventListener('change',e=>{if(e.target.files[0])loadAudioFile(e.target.files[0],'music');});
document.getElementById('videoFile').addEventListener('change',e=>{document.getElementById('bgVideo').src=URL.createObjectURL(e.target.files[0]);});
function togglePlay(){if(playing){playing=false;if(musicNode)try{musicNode.stop();}catch{}pauseAt=currentTime;}else{initAudio();if(musicBuf){musicNode=audioCtx.createBufferSource();musicNode.buffer=musicBuf;let g=audioCtx.createGain();g.gain.value=1.8;musicNode.connect(g);g.connect(compNode);musicNode.start(0,pauseAt);}startAt=audioCtx.currentTime-pauseAt;playing=true;loop();}}
function loop(){if(!playing)return;currentTime=audioCtx?audioCtx.currentTime-startAt:0;document.getElementById('progressFill').style.width=currentTime/duration*100+'%';let ov=document.getElementById('lyricOverlay');ov.style.bottom=document.getElementById('textYPos').value+'%';ov.style.fontSize=document.getElementById('fontSize').value+'px';ov.innerHTML='';let lead=parseFloat(document.getElementById('yellowLead').value);let act=null,up=null;curLyrics.forEach(l=>{if(currentTime>=l.time&&currentTime<l.time+3)act=l;if(currentTime>=l.time-lead&&currentTime<l.time)up=l;});if(up){let s=document.createElement('span');s.className='lyric-word yellow-box';s.textContent=up.text;ov.appendChild(s);}if(act){let s=document.createElement('span');s.className='lyric-word blue-box';s.textContent=act.text;ov.appendChild(s);}requestAnimationFrame(loop);}
function setYellowEntry(){}function setBlueEntry(){}function addImage(e){let url=URL.createObjectURL(e.target.files[0]);let div=document.createElement('div');div.style.position='absolute';div.style.left='50px';div.style.top='50px';div.style.width='120px';let img=document.createElement('img');img.src=url;img.style.width='100%';div.appendChild(img);document.getElementById('imageLayer').appendChild(div);}
function startRender(){alert('Render High Quality 8Mbps');}
parseLyrics();
</script></body></html>
